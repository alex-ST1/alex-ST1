name: iOS Security & Build CI

on:
  push:
    branches: [ main, master, savings-tracker ]
  pull_request:
    branches: [ main, master, savings-tracker ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test iOS Swift Package
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Verify Swift Version
        run: swift --version

      - name: Run Unit & Security Tests
        working-directory: ios/SavingsTracker
        run: swift test -v

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Build & Package iOS IPA
        working-directory: ios/SavingsTracker
        run: ./package_ipa.sh

      - name: Upload IPA Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavingsTracker-iOS-IPA
          path: ios/SavingsTracker/SavingsTracker.ipa
          if-no-files-found: error
          retention-days: 30
