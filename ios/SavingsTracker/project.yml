name: SavingsTracker
options:
  bundleIdPrefix: com.savingstracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

settings:
  base:
    PRODUCT_NAME: "Savings Vault"
    PRODUCT_BUNDLE_IDENTIFIER: com.savingstracker.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
